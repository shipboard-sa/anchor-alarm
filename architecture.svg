<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="850" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0B2545">Anchor alarm — system architecture</text>

  <!-- ═══════════════════ INPUTS (left) ═══════════════════ -->
  <text x="95" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#73726C">INPUTS</text>

  <!-- GPS receiver -->
  <rect x="30" y="80" width="130" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="95" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0C447C">GPS receiver</text>
  <text x="95" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#185FA5">NMEA sentences</text>

  <!-- Touchscreen input -->
  <rect x="30" y="148" width="130" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="95" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0C447C">Touchscreen</text>
  <text x="95" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#185FA5">Set anchor, adjust</text>

  <!-- NMEA 2000 bus -->
  <rect x="30" y="216" width="130" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="95" y="237" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0C447C">NMEA 2000 bus</text>
  <text x="95" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#185FA5">Position, time, depth</text>

  <!-- ═══════════════════ CORE ALGORITHM (center) ═══════════════════ -->
  <text x="390" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#73726C">CORE ALGORITHM</text>

  <!-- Main algorithm container -->
  <rect x="210" y="76" width="360" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="390" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#04342C">Circle-fit engine</text>

  <!-- Sub-boxes inside algorithm -->
  <rect x="228" y="112" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="303" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#085041">Collect GPS fixes</text>
  <text x="303" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0F6E56">Rolling window</text>

  <rect x="402" y="112" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="477" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#085041">Fit circle</text>
  <text x="477" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0F6E56">Center + radius</text>

  <!-- Arrow between sub-boxes -->
  <line x1="378" y1="134" x2="400" y2="134" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Guard zones box -->
  <rect x="228" y="170" width="324" height="44" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="390" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#085041">Guard zones</text>
  <text x="390" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0F6E56">Rode floor (inner) · Alarm radius (outer) · Coarse guard (backup)</text>

  <!-- Lock rule box -->
  <rect x="228" y="224" width="324" height="38" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="390" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#085041">Lock rule + power-cut restore</text>
  <text x="528" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0F6E56"></text>

  <!-- Arrows: inputs → algorithm -->
  <line x1="160" y1="106" x2="208" y2="134" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="160" y1="174" x2="208" y2="160" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="160" y1="242" x2="208" y2="220" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════ DISPLAY (center-bottom) ═══════════════════ -->
  <text x="390" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#73726C">DISPLAY</text>

  <rect x="240" y="310" width="300" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="390" y="333" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0C447C">Touchscreen (800 x 480)</text>
  <text x="390" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#185FA5">Anchor map · swing circle · status · 24h clock (idle)</text>

  <!-- Arrow: algorithm → display -->
  <line x1="390" y1="276" x2="390" y2="308" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════ OUTPUTS (right) ═══════════════════ -->
  <text x="720" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#73726C">OUTPUTS</text>

  <!-- Alarm state: DRAG -->
  <rect x="640" y="80" width="160" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="720" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#712B13">Anchor drag alarm</text>
  <text x="720" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#993C1D">Buzzer + screen flash</text>

  <!-- Digital output to alarm panel -->
  <rect x="640" y="142" width="160" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="720" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#712B13">Panel output (DO)</text>
  <text x="720" y="179" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#993C1D">→ Alarm panel LED</text>

  <!-- Optional: automation engine -->
  <rect x="640" y="204" width="160" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="720" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#085041">Automation engine</text>
  <text x="720" y="241" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0F6E56">Optional integration</text>

  <!-- Arrows: algorithm → outputs -->
  <line x1="570" y1="120" x2="638" y2="104" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="160" x2="638" y2="166" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="200" x2="638" y2="224" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ═══════════════════ CIRCLE-FIT ILLUSTRATION (bottom-right) ═══════════════════ -->
  <text x="710" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#73726C">CIRCLE-FIT CONCEPT</text>

  <!-- Background -->
  <rect x="620" y="310" width="180" height="180" rx="10" fill="#F5F8FA" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Fitted circle (the swing) -->
  <circle cx="710" cy="400" r="60" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Rode floor (inner circle) -->
  <circle cx="710" cy="400" r="25" fill="none" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Coarse guard (outer circle) -->
  <circle cx="710" cy="400" r="75" fill="none" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Anchor point (center) -->
  <circle cx="710" cy="400" r="4" fill="#0B2545"/>
  <text x="710" y="416" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0B2545">⚓</text>

  <!-- Scattered GPS dots -->
  <circle cx="740" cy="365" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="755" cy="385" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="745" cy="410" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="725" cy="435" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="690" cy="445" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="665" cy="425" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="660" cy="395" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="670" cy="365" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="695" cy="350" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="735" cy="348" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="750" cy="400" r="2.5" fill="#185FA5" opacity="0.7"/>
  <circle cx="680" cy="450" r="2.5" fill="#185FA5" opacity="0.7"/>

  <!-- Boat icon (current position on swing) -->
  <circle cx="755" cy="385" r="5" fill="none" stroke="#0B2545" stroke-width="1"/>
  <line x1="755" y1="380" x2="755" y2="372" stroke="#0B2545" stroke-width="1"/>
  <path d="M756 373 L756 379 L762 378 Z" fill="#D85A30" opacity="0.8"/>

  <!-- Labels -->
  <text x="710" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0F6E56">Swing circle (fitted)</text>
  <text x="792" y="335" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#993C1D">Coarse guard</text>
  <text x="672" y="385" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#185FA5">Rode floor</text>

  <!-- ═══════════════════ HARDWARE (bottom-left) ═══════════════════ -->
  <rect x="40" y="310" width="170" height="60" rx="8" fill="#F5F8FA" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="125" y="333" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">ESP32-S3 + LCD</text>
  <text x="125" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#73726C">Standalone, bus-powered</text>

  <!-- Arrow: hardware → algorithm -->
  <path d="M175 310 L175 276 L228 276" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="400" width="170" height="90" rx="6" fill="#FAFAFA" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="52" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">Legend</text>
  <rect x="52" y="428" width="14" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="74" y="437" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">Input / display</text>
  <rect x="52" y="446" width="14" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="74" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">Algorithm / processing</text>
  <rect x="52" y="464" width="14" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="74" y="473" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">Alarm output</text>
  <line x1="52" y1="485" x2="66" y2="485" stroke="#73726C" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="74" y="489" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">Optional integration</text>
</svg>
